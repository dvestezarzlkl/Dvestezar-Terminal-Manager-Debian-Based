name: Update c_menu JBLibs gitlink

on:
  push:
    branches:
      - automation/c-menu-interrupt-integration
    paths:
      - ".github/run-c-menu-submodule-update"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: automation/c-menu-interrupt-integration
          fetch-depth: 0
          submodules: false

      - name: Point mandatory JBLibs submodule to 1.2.16
        run: |
          set -euo pipefail
          git update-index --add --cacheinfo 160000,0061ba47f836ad899e5f47811d8713d084bd1d1a,libs/JBLibs
          rm -f .github/run-c-menu-submodule-update
          rm -f .github/workflows/update-c-menu-submodule.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update JBLibs submodule to 1.2.16"
          git push origin HEAD:automation/c-menu-interrupt-integration
