name: Finalize UART loopback release

on:
  push:
    branches:
      - uart-loopback-diagnostics

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uart-loopback-diagnostics
          fetch-depth: 0

      - name: Update release files
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "libs/app/cfg.py",
              'VERSION = "1.9.6"',
              'VERSION = "1.9.7"',
          ) if 'VERSION = "1.9.6"' in Path("libs/app/cfg.py").read_text(encoding="utf-8") else None

          replace_once(
              "libs/app/menus/app_35_uart/menu.py",
              '_VERSION_: str = "1.1.0"',
              '_VERSION_: str = "1.2.0"',
          )

          readme = Path("readme.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("\nv1.9.6\n", "\nv1.9.7\n", 1)
          uart_anchor = "- nastavení délky testovacího textu a počtu opakování přímo z menu\n"
          uart_add = (
              uart_anchor
              + "- diagnostický UART loopback test běžných rychlostí od 9600 do 2 000 000 Bd\n"
              + "- testovací rámce s indexem a Modbus CRC16, kontrola timeoutů, CRC, dat a cizích bajtů\n"
              + "- průběžný stav testu se na obrazovce přepisuje na jednom řádku a po každé rychlosti zůstane souhrn\n"
              + "- plný verbose výpis každého rámce se ukládá do časově označeného logu v globálním `LOG_DIR`\n"
          )
          if "diagnostický UART loopback test" not in text:
              if uart_anchor not in text:
                  raise SystemExit("UART README anchor not found")
              text = text.replace(uart_anchor, uart_add, 1)
          readme.write_text(text, encoding="utf-8")

          changelog = Path("changelog.md")
          text = changelog.read_text(encoding="utf-8")
          section = """## v1.9.7

- ADD UART loopback diagnostika přímo v UART menu pro rychlosti 9600 až 2 000 000 Bd
- ADD testovací osmibajtové rámce s indexem pokusu a Modbus CRC16
- ADD statistiky TX/RX, timeoutů, CRC chyb, rozdílů dat a cizích bajtů pro každou rychlost
- ADD plný verbose log každého rámce do časově označeného souboru v globálním `LOG_DIR`
- UPD živý průběh testu se v terminálu přepisuje na jednom řádku, po rychlosti zůstane pouze souhrn
- FIX poslední odeslaný rámec dostane celý timeout na odpověď a nevzniká falešný timeout na konci časového okna
- UPD verze UART menu na 1.2.0 a hlavní aplikace na 1.9.7

"""
          if "## v1.9.7" not in text:
              if not text.startswith("# Changelog\n\n"):
                  raise SystemExit("Unexpected changelog header")
              text = "# Changelog\n\n" + section + text[len("# Changelog\n\n"):]
          changelog.write_text(text, encoding="utf-8")

          Path(".github/workflows/finalize_uart_release.yml").unlink()

      - name: Commit finalized release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize UART loopback diagnostics release 1.9.7"
          git push origin HEAD:uart-loopback-diagnostics
