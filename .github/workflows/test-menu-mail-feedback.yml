name: Test menu versions and mail feedback

on:
  pull_request:
    paths:
      - "libs/app/menus/menuBoss.py"
      - "libs/app/mail_hlp.py"
      - "libs/app/lng/**"
      - "libs/app/menus/app_20_node_red/**"
      - "libs/app/menus/app_30_ssh/**"
      - "libs/app/menus/app_33_sftpmanagr/**"
      - "tests/test_menu_mail_feedback.py"
      - "tests/test_mail_hlp.py"
      - "tests/test_node_red_handover_mail.py"
      - "tests/test_ssh_manager_mail.py"
      - "tests/test_sftp_key_mail.py"
      - ".github/workflows/test-menu-mail-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize mandatory JBLibs submodule
        run: |
          git submodule sync -- libs/JBLibs
          git submodule update --init --checkout -- libs/JBLibs

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare application log directory
        run: |
          sudo mkdir -p /var/log/jb_sys_apps
          sudo chown "$(id -u):$(id -g)" /var/log/jb_sys_apps

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            libs/app/menus/menuBoss.py \
            libs/app/mail_hlp.py \
            libs/app/menus/app_20_node_red/handover_mail.py \
            libs/app/menus/app_20_node_red/menu.py \
            libs/app/menus/app_30_ssh/menu.py \
            libs/app/menus/app_30_ssh/menu_user_key_edit.py \
            libs/app/menus/app_30_ssh/ssh_mail_hlp.py \
            libs/app/menus/app_33_sftpmanagr/menu.py \
            libs/app/menus/app_33_sftpmanagr/sftp_manager_hlp.py \
            tests/test_menu_mail_feedback.py

      - name: Run menu and mail regression tests
        run: |
          python -m unittest \
            tests.test_menu_mail_feedback \
            tests.test_mail_hlp \
            tests.test_node_red_handover_mail \
            tests.test_ssh_manager_mail \
            tests.test_sftp_key_mail
