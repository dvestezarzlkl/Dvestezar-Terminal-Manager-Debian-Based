name: Test SysApps Hub

on:
  pull_request:
    paths:
      - "libs/app/hub/**"
      - "libs/app/settings_package.py"
      - "libs/app/settings_menu.py"
      - "libs/app/service_host.py"
      - "libs/app/disk_hlp.py"
      - "libs/app/cfg.py"
      - "libs/app/c_cfg.py"
      - "libs/app/menus/menuBoss.py"
      - "libs/app/menus/menu.md"
      - "libs/app/menus/app_10_disk/**"
      - "libs/app/menus/app_12_swap/**"
      - "libs/app/menus/app_20_node_red/**"
      - "tests/test_hub_*.py"
      - "tests/test_settings_package.py"
      - "tests/test_service_host.py"
      - "tests/test_disk_hub_provider.py"
      - "tests/test_disk_settings_sync.py"
      - "tests/test_disk_menu_system_disk.py"
      - "tests/test_ptuuid_repair.py"
      - "tests/test_node_red_hub_provider.py"
      - "requirements.txt"
      - "readme.md"
      - "changelog.md"
      - "docs/sysapps-hub.md"
      - "docs/central-settings.md"
      - ".github/workflows/test-sysapps-hub.yml"
  push:
    branches:
      - main
    paths:
      - "libs/app/hub/**"
      - "libs/app/settings_package.py"
      - "libs/app/settings_menu.py"
      - "libs/app/service_host.py"
      - "libs/app/disk_hlp.py"
      - "libs/app/cfg.py"
      - "libs/app/c_cfg.py"
      - "libs/app/menus/menuBoss.py"
      - "libs/app/menus/menu.md"
      - "libs/app/menus/app_10_disk/**"
      - "libs/app/menus/app_12_swap/**"
      - "libs/app/menus/app_20_node_red/**"
      - "tests/test_hub_*.py"
      - "tests/test_settings_package.py"
      - "tests/test_service_host.py"
      - "tests/test_disk_hub_provider.py"
      - "tests/test_disk_settings_sync.py"
      - "tests/test_disk_menu_system_disk.py"
      - "tests/test_ptuuid_repair.py"
      - "tests/test_node_red_hub_provider.py"
      - "requirements.txt"
      - "readme.md"
      - "changelog.md"
      - "docs/sysapps-hub.md"
      - "docs/central-settings.md"
      - ".github/workflows/test-sysapps-hub.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Initialize mandatory JBLibs submodule
        run: git submodule update --init --checkout -- libs/JBLibs

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install project runtime requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Prepare application log directory
        run: |
          sudo mkdir -p /var/log/jb_sys_apps
          sudo chown "$(id -u):$(id -g)" /var/log/jb_sys_apps

      - name: Compile Hub and integration modules
        run: |
          python -m py_compile \
            libs/app/hub/*.py \
            libs/app/settings_package.py \
            libs/app/settings_menu.py \
            libs/app/service_host.py \
            libs/app/disk_hlp.py \
            libs/app/menus/app_10_disk/device_policy.py \
            libs/app/menus/app_10_disk/hub_provider.py \
            libs/app/menus/app_10_disk/ptuuid_repair.py \
            libs/app/menus/app_10_disk/menu.py \
            libs/app/menus/app_12_swap/menu.py \
            libs/app/menus/app_20_node_red/hub_provider.py \
            libs/app/menus/app_20_node_red/menu.py \
            libs/app/menus/menuBoss.py \
            libs/app/c_cfg.py \
            tests/test_hub_config_package.py \
            tests/test_hub_schema.py \
            tests/test_hub_runtime.py \
            tests/test_hub_mysql_integration.py \
            tests/test_settings_package.py \
            tests/test_service_host.py \
            tests/test_disk_hub_provider.py \
            tests/test_disk_settings_sync.py \
            tests/test_disk_menu_system_disk.py \
            tests/test_ptuuid_repair.py \
            tests/test_node_red_hub_provider.py

      - name: Run Hub and central settings tests
        env:
          SYSAPPS_TEST_MYSQL: "1"
          SYSAPPS_TEST_MYSQL_HOST: "127.0.0.1"
          SYSAPPS_TEST_MYSQL_PORT: "3306"
          SYSAPPS_TEST_MYSQL_USER: root
          SYSAPPS_TEST_MYSQL_PASSWORD: root
          SYSAPPS_TEST_MYSQL_DATABASE: sys_apps_ci
        run: |
          python -m unittest -v \
            tests.test_hub_config_package \
            tests.test_hub_schema \
            tests.test_hub_runtime \
            tests.test_hub_mysql_integration \
            tests.test_settings_package \
            tests.test_service_host \
            tests.test_disk_hub_provider \
            tests.test_disk_settings_sync \
            tests.test_disk_menu_system_disk \
            tests.test_ptuuid_repair \
            tests.test_node_red_hub_provider

      - name: Verify version and provider contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          cfg = Path("libs/app/cfg.py").read_text(encoding="utf-8")
          readme = Path("readme.md").read_text(encoding="utf-8")
          changelog = Path("changelog.md").read_text(encoding="utf-8")
          settings_package = Path("libs/app/settings_package.py").read_text(encoding="utf-8")
          settings_menu = Path("libs/app/settings_menu.py").read_text(encoding="utf-8")
          hub_models = Path("libs/app/hub/models.py").read_text(encoding="utf-8")
          node_menu = Path("libs/app/menus/app_20_node_red/menu.py").read_text(encoding="utf-8")
          disk_menu = Path("libs/app/menus/app_10_disk/menu.py").read_text(encoding="utf-8")
          swap_menu = Path("libs/app/menus/app_12_swap/menu.py").read_text(encoding="utf-8")
          disk_helper = Path("libs/app/disk_hlp.py").read_text(encoding="utf-8")
          disk_provider = Path("libs/app/menus/app_10_disk/hub_provider.py").read_text(encoding="utf-8")
          ptuuid_repair = Path("libs/app/menus/app_10_disk/ptuuid_repair.py").read_text(encoding="utf-8")
          main_menu = Path("libs/app/menus/menuBoss.py").read_text(encoding="utf-8")
          requirements = Path("requirements.txt").read_text(encoding="utf-8")

          version = re.search(r'^VERSION = "([^"]+)"', cfg, re.MULTILINE).group(1)
          disk_version = re.search(r'_VERSION_:str="([^"]+)"', disk_menu).group(1)
          swap_version = re.search(r'_VERSION_:str="([^"]+)"', swap_menu).group(1)
          assert version == "2.2.4"
          assert disk_version == "3.6.8"
          assert swap_version == "2.5.1"
          assert f"v{version}" in readme
          assert f"## v{version}" in changelog
          assert "SETTINGS_AUTH_USER" in cfg
          assert "SETTINGS_AUTH_PASSWORD" in cfg
          assert "SETTINGS_IMPORT_POLICY" in cfg
          assert "_SameOriginRedirectHandler" in settings_package
          assert 'add_unredirected_header("Authorization"' in settings_package
          assert "SettingsImportPolicy" in settings_package
          assert "policy_fields" in settings_package
          assert "detect_import_conflicts" in settings_package
          assert "sections were skipped by local policy" in settings_package
          assert "HTTP Basic Auth user" in settings_menu
          assert "Centralized import policy" in settings_menu
          assert "Processing centralized settings import" in settings_menu
          assert "No settings applied from revision" in settings_menu
          assert "attached: bool = True" in hub_models
          assert "catalog_ptuuids" in disk_provider
          assert "prepare_machine_id_for_first_boot" in disk_helper
          assert "Připravit nové Machine ID při prvním bootu" in disk_menu
          assert "zakázáno: živý systémový disk" in disk_menu
          assert "lsblk_list_disks(False)" in disk_menu
          assert '("PTUUID"' in disk_menu
          assert "disk.ptuuid or '-'" in disk_menu
          assert "Připravit nové PTUUID při restartu" in disk_menu
          assert "KRITICKÁ OPERACE NA SYSTÉMOVÉM DISKU" in disk_menu
          assert "prepare_system_disk_change" in disk_menu
          assert "sgdisk --disk-guid" in ptuuid_repair
          assert "--randomize-guids" not in ptuuid_repair
          assert "--partition-guid" not in ptuuid_repair
          assert "verify_partuuids" in ptuuid_repair
          assert "NERESTARTUJTE zařízení" in ptuuid_repair
          assert "getListOfActiveSwaps(False)" in swap_menu
          assert 'if s.type == "file"' in swap_menu
          assert '_HUB_PROVIDER_KEY_:str = "node_red"' in node_menu
          assert '_HUB_PROVIDER_KEY_:str = "disks"' in disk_menu
          assert "def hub_collect(context):" in disk_menu
          assert "def hub_apply_remote(updates):" in disk_menu
          assert 'Synchronize SysApps Hub' in main_menu
          assert 'Service host / FQDN' in main_menu
          assert 'startup_settings_update()' in main_menu
          assert 'check_update_availability(getMainScriptDir())' in main_menu
          assert 'atRight=_update_availability.status_text' in main_menu
          assert 'c_menu.globalTitle = _global_host_title' in main_menu
          assert 'showGlobalTitle=False' in main_menu
          assert "PyMySQL==1.2.0" in requirements
          PY
