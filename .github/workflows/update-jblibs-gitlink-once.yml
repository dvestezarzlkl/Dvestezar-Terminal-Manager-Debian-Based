name: Update JBLibs gitlink once

on:
  push:
    branches:
      - automation/mail-date-header-submodule
    paths:
      - ".github/changes/update-jblibs-gitlink.trigger"

permissions:
  contents: write

jobs:
  update-gitlink:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: automation/mail-date-header-submodule
          fetch-depth: 0
          submodules: false

      - name: Set exact JBLibs gitlink
        shell: bash
        run: |
          set -euo pipefail
          target="d0fbd0ec007caa38e8f7f870e7e6687841e81ff5"
          test "$(tr -d '\r\n' < .github/changes/update-jblibs-gitlink.trigger)" = "$target"
          git update-index --add --cacheinfo "160000,$target,libs/JBLibs"
          rm .github/changes/update-jblibs-gitlink.trigger
          rm .github/workflows/update-jblibs-gitlink-once.yml
          git add -A
          git diff --cached --submodule=short

      - name: Commit gitlink update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JBDev automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update JBLibs gitlink to 1.2.15"
          git push origin HEAD:automation/mail-date-header-submodule
